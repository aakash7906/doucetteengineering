<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10bc00" />
      <stop offset="100%" stop-color="#0da800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4">
    <line x1="50" y1="100" x2="450" y2="100" />
    <line x1="50" y1="200" x2="450" y2="200" />
    <line x1="50" y1="300" x2="450" y2="300" />
    <line x1="50" y1="400" x2="450" y2="400" />
    <line x1="100" y1="50" x2="100" y2="450" />
    <line x1="200" y1="50" x2="200" y2="450" />
    <line x1="300" y1="50" x2="300" y2="450" />
    <line x1="400" y1="50" x2="400" y2="450" />
  </g>

  <!-- Glow circle -->
  <circle cx="250" cy="230" r="120" fill="#10bc00" opacity="0.15" filter="url(#glow)" />

  <!-- Central Engineering Emblem -->
  <rect x="140" y="120" width="220" height="220" rx="48" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- DE Monogram -->
  <text x="250" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="108" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-3">DE</text>
  
  <!-- Subtitle Tag -->
  <text x="250" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">DOUCETTE</text>
  <text x="250" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#10bc00" text-anchor="middle" letter-spacing="3">ENGINEERING PORTAL</text>
</svg>
