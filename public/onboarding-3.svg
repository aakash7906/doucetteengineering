<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="32" fill="url(#g3)" />

  <!-- Trade Pro & Direct Connect Illustration -->
  <g transform="translate(140, 85)">
    <rect width="320" height="250" rx="28" fill="#1e293b" stroke="#334155" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.15))" />
    
    <!-- Header with Pro Badge -->
    <rect x="25" y="25" width="46" height="46" rx="16" fill="#f59e0b" />
    <!-- Hardhat icon -->
    <path d="M 36 54 C 36 44 44 38 48 38 C 52 38 60 44 60 54 Z" fill="#ffffff" />
    <rect x="33" y="53" width="30" height="4" rx="2" fill="#ffffff" />

    <text x="84" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff">Trade Pro &amp; Owners</text>
    <text x="84" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#10bc00">Instant Quotes &amp; Permits</text>

    <!-- Pricing Row Box -->
    <rect x="25" y="95" width="270" height="60" rx="16" fill="#0f172a" stroke="#334155" />
    <text x="40" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Starting Design Fee</text>
    <text x="40" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#10bc00">$2,400</text>
    <text x="280" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">48-Hr Dispatch</text>

    <!-- Bottom Button Shape -->
    <rect x="25" y="175" width="270" height="48" rx="14" fill="#10bc00" />
    <text x="160" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Connect With P.E. Engineer &#8594;</text>
  </g>
</svg>